<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" fill="none">
  <defs>
    <linearGradient id="drona-logo-gradient" x1="110" y1="100" x2="210" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2148" />
      <stop offset="45%" stop-color="#102B63" />
      <stop offset="80%" stop-color="#08B6D8" />
      <stop offset="100%" stop-color="#16C4E8" />
    </linearGradient>
  </defs>

  <!-- Network "D" Mark (Centered Top) -->
  <g transform="translate(110, 8)" stroke="url(#drona-logo-gradient)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer D Mesh -->
    <path d="M 22 15 L 22 85 L 55 85 C 75 85 88 72 88 50 C 88 28 75 15 55 15 Z" stroke-width="3" fill="none" />

    <!-- Internal Mesh Cross-links -->
    <path d="M 22 15 L 42 35 L 22 50 L 45 65 L 22 85" stroke-width="1.8" opacity="0.85" />
    <path d="M 42 35 L 62 20 L 55 15" stroke-width="1.8" opacity="0.85" />
    <path d="M 62 20 L 78 35 L 88 50 L 75 68 L 55 85" stroke-width="1.8" opacity="0.85" />
    <path d="M 42 35 L 55 50 L 78 35" stroke-width="1.8" opacity="0.85" />
    <path d="M 22 50 L 55 50 L 45 65 L 65 78 L 55 85" stroke-width="1.8" opacity="0.85" />
    <path d="M 55 50 L 75 68" stroke-width="1.8" opacity="0.85" />

    <!-- Prominent Upward Growth Chart Trend Line -->
    <path d="M 26 70 L 42 42 L 55 58 L 78 26" stroke="url(#drona-logo-gradient)" stroke-width="4.5" fill="none" />
  </g>

  <!-- Network Nodes -->
  <g transform="translate(110, 8)">
    <circle cx="22" cy="15" r="3" fill="#0B2148" />
    <circle cx="22" cy="50" r="3" fill="#0B2148" />
    <circle cx="22" cy="85" r="3" fill="#0B2148" />
    <circle cx="42" cy="35" r="3" fill="#102B63" />
    <circle cx="62" cy="20" r="3" fill="#08B6D8" />
    <circle cx="78" cy="35" r="3.5" fill="#16C4E8" />
    <circle cx="88" cy="50" r="3" fill="#08B6D8" />
    <circle cx="75" cy="68" r="3" fill="#08B6D8" />
    <circle cx="55" cy="85" r="3" fill="#102B63" />
    <circle cx="45" cy="65" r="3" fill="#102B63" />
    <circle cx="55" cy="50" r="3.5" fill="#08B6D8" />
    <circle cx="65" cy="78" r="3" fill="#08B6D8" />
    <circle cx="26" cy="70" r="3.5" fill="#0B2148" />
    <circle cx="42" cy="42" r="3.5" fill="#102B63" />
    <circle cx="55" cy="58" r="3.5" fill="#08B6D8" />
    <circle cx="78" cy="26" r="4" fill="#16C4E8" />
  </g>

  <!-- DRONA Text -->
  <text x="160" y="124" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" fill="#0B2148" letter-spacing="1">DRONA</text>
  
  <!-- ENTERPRISES Text -->
  <text x="160" y="146" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#08B6D8" letter-spacing="4">ENTERPRISES</text>
</svg>
